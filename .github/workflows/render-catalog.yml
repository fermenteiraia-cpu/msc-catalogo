name: Render catalog art

on:
  # Disparado pela Edge Function trigger-render (botão "Gerar arte final").
  workflow_dispatch:
    inputs:
      render_run_id:
        description: "UUID da linha render_runs criada pela trigger-render"
        required: true
        type: string
      catalog_id:
        description: "UUID do catálogo a renderizar"
        required: true
        type: string
      triggered_by_user_id:
        description: "UUID do usuário que disparou o render"
        required: false
        type: string
      style:
        description: "Sobrescrever o estilo (ex: festivo-maes, trabalhador, black-friday). Vazio = automático pelo theme_key."
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts (Lato + DejaVu)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-lato fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install --quiet pillow requests pyyaml openai playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Render catalog (HTML → screenshot → gpt-image-2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RENDER_RUN_ID: ${{ inputs.render_run_id }}
          CATALOG_ID: ${{ inputs.catalog_id }}
          TRIGGERED_BY_USER_ID: ${{ inputs.triggered_by_user_id }}
          STYLE: ${{ inputs.style }}
        run: python scripts/render_catalog_html.py
